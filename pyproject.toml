[project]
name = "responsaas"
version = "0.1.0"
description = ""
authors = [
    {name = "DanCardin", email = "ddcardin@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "responses>=0.17.0",
    "fastapi>=0.101.1",
    "pydantic>=2.2.0",
    "cappa>=0.32.2",
]

[project.optional-dependencies]
pmr = ["pytest-mock-resources[docker]>=2.8.0"]
server = ["uvicorn"]

[project.scripts]
responsaas = "responsaas.__main__:main"

[dependency-groups]
dev = [
    "black>=23.7.0",
    "ruff>=0.9.0",
    "coverage>=6",
    "types-requests>=2.31.0.2",
    "mypy>=1.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/responsaas"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["C", "D", "E", "F", "I", "N", "Q", "RET", "RUF", "S", "T", "UP", "YTT"]
ignore = [
    "C901",
    "E501",
    "S101",
    "D1",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.coverage.run]
branch = true
parallel = true
include = ["src/*"]

[tool.pytest.ini_options]
doctest_optionflags = "NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL ELLIPSIS"
addopts = "--doctest-modules -vv --ff --strict-markers"
norecursedirs = ".* build dist *.egg bin"
